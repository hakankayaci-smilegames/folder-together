name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          echo "Building version ${VERSION}..."

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/folder-together-linux-amd64 cmd/main.go

          # Windows AMD64 (.exe)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/folder-together-windows-amd64.exe cmd/main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/folder-together-linux-amd64
            dist/folder-together-windows-amd64.exe
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
